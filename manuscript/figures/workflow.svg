<svg xmlns="http://www.w3.org/2000/svg" width="178mm" height="118mm" viewBox="0 0 1000 663" role="img" aria-labelledby="title desc">
<title id="title">Barbac: raw reads or barcode counts to lineage trajectories</title>
<desc id="desc">Single-end reads map directly; overlapping pairs merge with PEAR before mapping. Reference-mapped BAMs feed barcode extraction. Extracted counts or independent count tables feed native abundance-aware clustering. Memberships link samples to lineage frequencies, statistics and plots.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#55514b"/></marker></defs>
