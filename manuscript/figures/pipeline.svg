<svg xmlns="http://www.w3.org/2000/svg" width="178mm" height="117.8mm" viewBox="0 0 1300 860" role="img" aria-labelledby="t d">
<title id="t">barbac pipeline: Illumina reads or barcode counts to lineage trajectories</title>
<desc id="d">Reads pass quality control, optional pair merging, mapping and barcode extraction. Extracted counts or an independent count table enter native abundance-aware clustering. Clusters feed statistics and lineage-frequency plots over time.</desc>
<rect width="1300" height="860" fill="#fff"/>
<rect x="40" y="40" width="215" height="92" rx="14" fill="#fff" stroke="#1A5B5B" stroke-width="2.5"/>
<path d="M58 62h21.0l9.0 9.0v28.0H58z" fill="#1A5B5B"/><path d="M79.0 62v9.0h9.0z" fill="#fff" fill-opacity="0.6"/><text x="73.0" y="114.0" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.0" fill="#2f2c28">.fastq</text>
<text x="104" y="76" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#14161a">Illumina reads</text>
<text x="104" y="98" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6f6a63">R1-only or overlapping</text>
<text x="104" y="116" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6f6a63">R1 + R2</text>
