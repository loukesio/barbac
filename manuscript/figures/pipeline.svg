<text x="65" y="245" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="bold" fill="#D1422F">barbac_map()</text>
<text x="58" y="278" font-family="Arial,Helvetica,sans-serif" font-size="16" font-style="italic" font-weight="bold" fill="#14161a">FastQC</text>
<text x="58" y="306" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6f6a63">Merge overlapping pairs</text>
<text x="58" y="329" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6f6a63">PEAR; R1-only skips this</text>
