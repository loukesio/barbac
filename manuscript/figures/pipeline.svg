<text x="869" y="76" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#14161a">Barcode counts</text>
<text x="869" y="98" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6f6a63">enter clustering</text>
<text x="869" y="116" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6f6a63">without FASTQ</text>
<rect x="40" y="180" width="215" height="300" rx="14" fill="#fff" stroke="#1A5B5B" stroke-width="2.5"/>
