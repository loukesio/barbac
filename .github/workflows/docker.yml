name: Build and publish Docker image

# When to run:
#   * push to main       -> tag `latest` + short SHA on ghcr.io
#   * push tag `v*`      -> tag semver (0.1.0, 0.1, latest) on ghcr.io
#   * pull_request       -> build only (verifies the Dockerfile still works)
#   * workflow_dispatch  -> manual run from the Actions tab
on:
  push:
    branches: [ main ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The auto-provisioned GITHUB_TOKEN needs write access to packages to push
# to ghcr.io. This scope only applies to the workflow that requests it.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # PRs from forks cannot push; the step is skipped there.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Rules apply in order; each produces a tag when its condition matches.
          #   type=raw   : the literal `latest` on default-branch pushes
          #   type=sha   : short commit SHA on any push
          #   type=semver: derived from git tag vN.N.N -> `N.N.N`, `N.N`, `latest`
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (and push, unless PR)
        uses: docker/build-push-action@v5
        with:
          context: .
          # PRs build but do not push, so contributors can verify the Dockerfile
          # without needing package-write permission.
          push: ${{ github.event_name != 'pull_request' }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64
