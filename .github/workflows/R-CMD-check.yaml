name: R-CMD-check

# Standard r-lib/actions setup: runs R CMD check on Linux (release R) on
# every push to main and every pull request. Sufficient for a public
# package; add windows/mac + oldrel/devel matrices if you later target
# CRAN cross-platform coverage.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
          needs: check

      # ltc is a GitHub-only palette used by the vignette. Install it so
      # R CMD check --as-cran doesn't flag it as an unstated dependency.
      - name: Install GitHub-only palette dependency
        run: Rscript -e 'remotes::install_github("loukesio/ltc_palettes", upgrade = "never")'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
