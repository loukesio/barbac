name: Studio

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::shiny
            any::bslib
            any::DT
            any::future
            any::promises
            any::jsonlite
            any::digest
            any::ggiraph
            any::zip
            any::testthat
          needs: check
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: studio-tools
          create-args: >-
            -c conda-forge -c bioconda
            pear=0.9.6 minimap2 samtools
          init-shell: bash
          cache-environment: true
      - name: Prepare the current native release
        run: Rscript app/run.R --prepare-only
      - name: Verify native clustering, extraction and report exports
        shell: bash -el {0}
        run: Rscript app/tests/run_tests.R
